name: test-gate
"on":
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  canonical-tests:
    name: canonical tests
    # Public repos always use the fallback; the layout budget tests need ubuntu-latest, not ubuntu-slim
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').medium || fromJSON('["ubuntu-latest"]') }}
    # Bound the job so a hung step fails fast instead of holding a runner until
    # outrunner's 2h30m reaper. Raise it to about three times the suite's
    # slowest successful run when the canonical suite needs longer.
    timeout-minutes: 30
    outputs:
      tests_ran: ${{ steps.test.outputs.tests_ran }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Belt-and-braces for the pipx: pins in .mise.toml. Those pins now declare
      # uv themselves, so mise provisions it; this step keeps the gate working on
      # a repo whose .mise.toml predates that (a re-render lands it), where mise
      # would otherwise fail with "pipx is required to install pipx:<tool>".
      # Mirrors this repo's own .github/workflows/test-gate.yml.
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      # Provision the Shared Config Directory and pinned tools before
      # running tasks that rely on shared configuration.
      - uses: Rubio-Enterprises/.github/actions/standards-bootstrap@main
        with:
          app-id: ${{ secrets.STANDARDS_READER_APP_ID }}
          private-key: ${{ secrets.STANDARDS_READER_APP_PRIVATE_KEY }}
          keep-route: false
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - id: test
        name: Run canonical non-E2E tests
        env:
          RUBIO_TEST_GATE_COUNT_OUTPUT: ${{ runner.temp }}/test-gate-count
        run: |
          set -euo pipefail
          rm -f "$RUBIO_TEST_GATE_COUNT_OUTPUT"
          mise run test
          test -s "$RUBIO_TEST_GATE_COUNT_OUTPUT"
          test "$(cat "$RUBIO_TEST_GATE_COUNT_OUTPUT")" -gt 0
          echo "tests_ran=true" >> "$GITHUB_OUTPUT"

  aggregate:
    name: test-gate
    if: ${{ always() }}
    needs: [canonical-tests]
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 10
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Require successful non-empty test execution
        run: >-
          jq -e 'length > 0 and all(.[]; .result == "success" and
          .outputs.tests_ran == "true")' <<<"$NEEDS_JSON"
